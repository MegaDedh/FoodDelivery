[versions]
# main
gradle_version = "8.0.2"
kotlin_version = "1.8.20"
hilt_version = "2.46.1"

# android
min_sdk_version = "24"
target_sdk_version = "33"
compile_sdk_version = "33"
version_code = "1"
version_name = "0.1"

apkName = "food-delivery-v0.1"
applicationId = "pro.megadedh.fooddelivery"

# common
androidx_core_version = "1.10.1"
androidx_appcompat_version = "1.6.1"
androidx_fragment_version = "1.5.3"
material_version = "1.9.0"
constraint_layout_version = "2.1.4"
coroutines_version = "1.7.1"
lifecycle_version = "2.6.1"
threetenabp_version = "1.3.1"
androidx_annotation_version = "1.3.0"
permission_dispatcher = "4.8.0"
cicerone_version = "7.1"
timber_version = "5.0.1"

# data
room_version = "2.5.0"
datastore_version = "1.0.0"
okhttp_version = "4.9.3"
curl_logging_version = "0.7.0"
retrofit_version = "2.9.0"
moshi_version = "1.14.0"
coil_version = "2.2.2"

# utils
adapter_delegate_version = "4.3.2"
view_binding_delegate_version = "1.5.9"
ktlint_version = "11.3.1"

# test
junit_version = "4.13.2"
androidx_junit_version = "1.1.5"
espresso_version = "3.5.1"

# input
masked_input_version = "6.1.0"

[plugins]
androidApplication      = { id = "com.android.application", version.ref = "gradle_version" }
androidLibrary          = { id = "com.android.library", version.ref = "gradle_version" }
kotlinAndroid           = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin_version" }
kotlinJvm               = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin_version" }
kapt                    = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin_version" }
parcelize               = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin_version" }
hiltAndroid             = { id = "com.google.dagger.hilt.android", version.ref = "hilt_version" }


[libraries]
gradle                  = { module = "com.android.tools.build:gradle", version.ref = "gradle_version" }
kotlin                  = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin_version" }
hilt                    = { module = "com.google.dagger:hilt-android-gradle-plugin", version.ref = "hilt_version" }

androidxCore            = { module = "androidx.core:core-ktx", version.ref = "androidx_core_version" }
androidxAppcompat       = { module = "androidx.appcompat:appcompat", version.ref = "androidx_appcompat_version" }
material                = { module = "com.google.android.material:material", version.ref = "material_version" }
constraintlayout        = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraint_layout_version"}

daggerJvm               = { module = "com.google.dagger:dagger", version.ref = "hilt_version" }
daggerJvmCompiler       = { module = "com.google.dagger:dagger-compiler", version.ref = "hilt_version" }
hiltCore                = { module = "com.google.dagger:hilt-core", version.ref = "hilt_version" }

androidxFragment        = { module = "androidx.fragment:fragment-ktx", version.ref = "androidx_fragment_version" }
viewBindingDelegate     = { module = "com.github.kirich1409:viewbindingpropertydelegate", version.ref = "view_binding_delegate_version" }
cicerone                = { module = "com.github.terrakok:cicerone", version.ref = "cicerone_version" }
hiltAndroid             = { module = "com.google.dagger:hilt-android", version.ref = "hilt_version" }
hiltCompiler            = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt_version" }
lifecycle               = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle_version" }
livedata                = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "lifecycle_version" }

moshi                   = { module = "com.squareup.moshi:moshi", version.ref = "moshi_version" }
moshiCodegen            = { module = "com.squareup.moshi:moshi-kotlin-codegen", version.ref = "moshi_version" }
moshiAdapters           = { module = "com.squareup.moshi:moshi-adapters", version.ref = "moshi_version" }

adapterDelegate         = { module = "com.hannesdorfmann:adapterdelegates4-kotlin-dsl-viewbinding", version.ref = "adapter_delegate_version" }
coil                    = { module = "io.coil-kt:coil", version.ref = "coil_version" }
threetenabp             = { module = "com.jakewharton.threetenabp:threetenabp", version.ref = "threetenabp_version" }
timber                  = { module = "com.jakewharton.timber:timber", version.ref = "timber_version" }

room                    = { module = "androidx.room:room-runtime", version.ref = "room_version" }
roomKtx                 = { module = "androidx.room:room-ktx", version.ref = "room_version" }
roomCompiler            = { module = "androidx.room:room-compiler", version.ref = "room_version" }

retrofit                = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit_version" }
retrofitMoshiConverter  = { module = "com.squareup.retrofit2:converter-moshi", version.ref = "retrofit_version" }
okhttp                  = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp_version" }
okhttpLogging           = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp_version" }
curlLogging             = { module = "com.github.mrmike:ok2curl", version.ref = "curl_logging_version" }

coroutinesCore          = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines_version" }
coroutinesAndroid       = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines_version" }
datastore               = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore_version" }

junit                   = { module = "junit:junit", version.ref = "junit_version" }
androidxJunit           = { module = "androidx.test.ext:junit", version.ref = "androidx_junit_version" }
espresso                = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso_version" }

ktlint                  = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint_version" }

[bundles]
androidBundle           = ["gradle", "kotlin", "hilt"]
commonBundle            = ["androidxCore", "androidxAppcompat", "material"]
uiBundle                = ["viewBindingDelegate", "hiltAndroid", "cicerone"]
moshiBundle             = ["moshi", "moshiAdapters"]

roomBundle              = ["room", "roomKtx"]

retrofitBundle          = ["retrofit", "retrofitMoshiConverter"]
okhttpBundle            = ["okhttp", "okhttpLogging", "curlLogging"]

testBundle              = ["junit", "androidxJunit", "espresso"]